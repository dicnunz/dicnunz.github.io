name: Verify portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check static documents and references
        run: node tools/qa-check.mjs
      - name: Install pinned browser tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile pages
        run: node tools/browser-smoke.mjs
        env:
          BROWSER_SMOKE_ARTIFACTS: ${{ runner.temp }}/portfolio-browser-smoke
      - name: Upload screenshots and check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: ${{ runner.temp }}/portfolio-browser-smoke
          if-no-files-found: ignore
          retention-days: 14
